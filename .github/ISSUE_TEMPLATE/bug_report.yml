name: Bug report / 问题反馈
description: Report a reproducible MeowTools problem / 反馈可复现的问题
title: "[Bug] "
body:
  - type: input
    id: versions
    attributes:
      label: Versions / 版本
      description: MeowTools version, exact Paper build and Java version / 插件版本、具体 Paper 构建和 Java 版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps / 复现步骤
      description: Include expected and actual behavior / 包括预期结果与实际表现
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and configuration / 日志与相关配置
      description: Remove tokens, passwords, IP addresses and private player data / 请移除令牌、密码、IP 和玩家隐私信息
      render: text
  - type: textarea
    id: plugins
    attributes:
      label: Other plugins / 其他插件
      description: Especially permissions, protection and inventory plugins / 尤其是权限、保护和背包相关插件
